<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun Life – Startup Engagements</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --y:#FFCD00;--yd:#C8A400;
  --navy:#002855;--nm:#003B6F;
  --teal:#007B8A;--teal2:#009DAF;
  --wh:#FFFFFF;--off:#F4F2EC;
  --mut:#5A6278;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--off);display:flex;flex-direction:column}



/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* LEFT */
.left{
  width:34%;min-width:300px;padding:44px 40px 36px 52px;
  display:flex;flex-direction:column;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
  background:var(--wh);border-right:1px solid rgba(0,40,85,0.07);
}
.left::after{
  content:'';position:absolute;bottom:-100px;left:-60px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,205,0,0.15) 0%,transparent 70%);
  pointer-events:none;
}
.eyebrow{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,4.2vw,58px);font-weight:700;
  color:var(--navy);line-height:1.14;margin-bottom:22px;
}
.eyebrow em{font-style:italic;color:var(--teal)}
.sub{font-size:18px;color:var(--mut);line-height:1.78;max-width:380px;margin-bottom:30px}
.stat-row{display:flex;gap:24px;margin-bottom:34px}
.stat{display:flex;flex-direction:column}
.stat-num{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--navy);line-height:1}
.stat-label{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.hint-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--navy);color:var(--y);
  border-radius:40px;padding:10px 20px;font-size:14.5px;font-weight:500;
  letter-spacing:0.3px;width:fit-content;
}
.hint-dot{width:7px;height:7px;border-radius:50%;background:var(--y);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

/* RIGHT */
.right{flex:1;position:relative;overflow:hidden;background:var(--off)}
#bubble-canvas{width:100%;height:100%;position:relative}

/* ── BUBBLE WRAPPER ── */
.bwrap{
  position:absolute;
  transform:translate(-50%,-50%);
  cursor:pointer;
  animation:popIn .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes popIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.bubble-ring{
  border-radius:50%;
  padding:4px;
  position:relative;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1), filter .28s ease;
  background:var(--grad);
  filter:
    drop-shadow(0 6px 16px rgba(0,40,85,0.22))
    drop-shadow(0 14px 28px rgba(0,40,85,0.12));
}
.bwrap:hover .bubble-ring{
  transform:scale(1.1);
  filter:
    drop-shadow(0 14px 32px rgba(0,40,85,0.38))
    drop-shadow(0 26px 52px rgba(0,40,85,0.22));
  z-index:9000;
}
.bwrap:hover{z-index:9000!important}

/* White inner circle */
.bubble-inner{
  border-radius:50%;
  background:#FFFFFF;
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
  position:relative;
  overflow:hidden;
}
.bubble-inner::before{
  content:'';
  position:absolute;
  top:8%;left:14%;
  width:38%;height:28%;
  background:radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.85) 0%, transparent 80%);
  border-radius:50%;
  transform:rotate(-30deg);
  pointer-events:none;
}

.bubble-icon{
  line-height:1;flex-shrink:0;
  position:relative;z-index:1;
}
.bubble-name{
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.6px;
  text-align:center;
  line-height:1.1;
  padding:0 8%;
  word-break:break-word;
  position:relative;z-index:1;
}

/* TOOLTIP */
.tt{
  position:fixed;background:var(--navy);color:var(--wh);
  border-radius:14px;padding:15px 20px;max-width:250px;min-width:190px;
  pointer-events:none;opacity:0;
  transform:translateY(8px) scale(.96);
  transition:opacity .16s,transform .16s;
  z-index:9999;box-shadow:0 10px 40px rgba(0,40,85,0.3);
  border-left:4px solid var(--y);
}
.tt.on{opacity:1;transform:translateY(0) scale(1)}
.tt-name{font-size:13px;font-weight:700;color:var(--y);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.tt-sector{font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--teal2);margin-bottom:9px}
.tt-desc{font-size:13px;line-height:1.57;color:rgba(255,255,255,.87)}
.tt-tag{display:inline-block;margin-top:10px;background:rgba(255,205,0,.14);color:var(--y);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:600;letter-spacing:.3px}
</style>
</head>

const canvas = document.getElementById('bubble-canvas');
const tt  = document.getElementById('tt');
const ttN = document.getElementById('tt-name');
const ttS = document.getElementById('tt-sector');
const ttD = document.getElementById('tt-desc');
const ttT = document.getElementById('tt-tag');

function layout(){
  canvas.innerHTML = '';
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight;

  // Sort by size descending — largest first (go in center)
  const sorted = [...startups].sort((a,b) => b.size - a.size);
  
  // Pack bubbles using a physics-inspired approach:
  // Place each bubble as close to center as possible without overlapping
  // Allow slight overlap (like the inspo) by using a small negative gap
  const OVERLAP = -3; // negative = allow slight overlap
  
  const nodes = [];
  const cx = W * 0.5;
  const cy = H * 0.5;

  for (const s of sorted) {
    const r = s.size / 2 + 4; // radius including ring
    let bestX = cx, bestY = cy;
    let placed = false;

    if (nodes.length === 0) {
      // First (largest) goes in center
      nodes.push({ x: cx, y: cy, r, s });
      continue;
    }

    // Try angles in spiral outward from center
    let bestDist = Infinity;
    const steps = 800;
    for (let t = 0; t < steps * 6; t++) {
      // Golden angle spiral
      const angle = t * 2.39996;
      const dist = (t / steps) * Math.max(W, H) * 0.7;
      const x = cx + Math.cos(angle) * dist;
      const y = cy + Math.sin(angle) * dist;

      // Must be within canvas bounds
      if (x - r < 4 || x + r > W - 4 || y - r < 4 || y + r > H - 4) continue;

      // Check against all placed nodes — allow OVERLAP amount of contact
      let ok = true;
      let maxOverlap = 0;
      for (const n of nodes) {
        const d = Math.hypot(x - n.x, y - n.y);
        const minD = r + n.r + OVERLAP;
        if (d < minD) { ok = false; break; }
      }
      if (!ok) continue;

      // Prefer positions closer to center
      const dCenter = Math.hypot(x - cx, y - cy);
      if (dCenter < bestDist) {
        bestDist = dCenter;
        bestX = x; bestY = y;
        placed = true;
        // Once we find a good close candidate, keep searching a bit more
        if (t > 50) break;
      }
    }

    // Fallback: force placement
    if (!placed) {
      for (let attempt = 0; attempt < 1000; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = (attempt / 1000) * Math.max(W, H) * 0.5 + r;
        const x = cx + Math.cos(angle) * dist;
        const y = cy + Math.sin(angle) * dist;
        if (x - r < 4 || x + r > W - 4 || y - r < 4 || y + r > H - 4) continue;
        let ok = true;
        for (const n of nodes) {
          if (Math.hypot(x - n.x, y - n.y) < r + n.r + OVERLAP) { ok = false; break; }
        }
        if (ok) { bestX = x; bestY = y; break; }
      }
    }

    nodes.push({ x: bestX, y: bestY, r, s });
  }

  // Gentle attraction toward center — pull all nodes in slightly
  for (let iter = 0; iter < 80; iter++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const dx = cx - n.x, dy = cy - n.y;
      const d = Math.hypot(dx, dy) || 1;
      const step = Math.min(2, d * 0.04);
      const nx2 = n.x + (dx / d) * step;
      const ny2 = n.y + (dy / d) * step;

      // Check if moving toward center causes overlap
      let ok = true;
      for (let j = 0; j < nodes.length; j++) {
        if (i === j) continue;
        if (Math.hypot(nx2 - nodes[j].x, ny2 - nodes[j].y) < n.r + nodes[j].r + OVERLAP) {
          ok = false; break;
        }
      }
      if (ok && nx2 - n.r > 4 && nx2 + n.r < W - 4 && ny2 - n.r > 4 && ny2 + n.r < H - 4) {
        n.x = nx2; n.y = ny2; moved = true;
      }
    }
    if (!moved) break;
  }

  nodes.forEach((n, i) => render(n.s, n.x, n.y, sorted.indexOf(n.s)));
}

function render(s, bx, by, idx){
  const grad   = GRADS[idx % GRADS.length];
  const icolor = ICON_COLORS[idx % ICON_COLORS.length];
  const innerSz  = s.size;
  const ringTotal = innerSz + 8;

  const wrap = document.createElement('div');
  wrap.className = 'bwrap';
  wrap.style.cssText = `left:${bx}px;top:${by}px;animation-delay:${(idx*0.04).toFixed(2)}s;z-index:${Math.round(s.size)}`;

  const ring = document.createElement('div');
  ring.className = 'bubble-ring';
  ring.style.cssText = `width:${ringTotal}px;height:${ringTotal}px;--grad:${grad};background:${grad};`;

  const inner = document.createElement('div');
  inner.className = 'bubble-inner';

  const iconWrap = document.createElement('div');
  iconWrap.className = 'bubble-icon';
  const iconSz = Math.floor(innerSz * 0.36);
  iconWrap.style.cssText = `width:${iconSz}px;height:${iconSz}px;`;
  const svgStr = s.svg.replace(/FILL/g, icolor);
  iconWrap.innerHTML = svgStr;
  const svgEl = iconWrap.querySelector('svg');
  if(svgEl){ svgEl.style.width='100%'; svgEl.style.height='100%'; }

  const namePx = Math.max(7, Math.floor(innerSz * 0.108));
  const nm = document.createElement('div');
  nm.className = 'bubble-name';
  nm.style.cssText = `font-size:${namePx}px;color:${icolor};`;
  nm.textContent = s.name;

  inner.appendChild(iconWrap);
  inner.appendChild(nm);
  ring.appendChild(inner);
  wrap.appendChild(ring);

  wrap.addEventListener('mouseenter', e => show(e,s));
  wrap.addEventListener('mousemove',  move);
  wrap.addEventListener('mouseleave', hide);
  canvas.appendChild(wrap);
}

function show(e,s){
  ttN.textContent=s.name; ttS.textContent=s.sector;
  ttD.textContent=s.desc; ttT.textContent=s.tag;
  tt.classList.add('on'); move(e);
}
function move(e){
  let x=e.clientX+18, y=e.clientY+16;
  if(x+260>window.innerWidth)  x=e.clientX-270;
  if(y+165>window.innerHeight) y=e.clientY-170;
  tt.style.left=x+'px'; tt.style.top=y+'px';
}
function hide(){ tt.classList.remove('on'); }

layout();
window.addEventListener('resize', layout);
</script>
